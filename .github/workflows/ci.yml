name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.24.0"

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check PyYAML "setuptools>=77"

      - name: Test Python producer and validator
        run: python -m unittest discover -s tests -v

      - name: Check generated fixtures
        run: python conformance/generate_fixtures.py --check

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Import tracked npm lockfile for pnpm
        shell: bash
        run: pnpm import

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck TypeScript implementation
        run: pnpm exec tsc --noEmit -p implementations/typescript/tsconfig.json

      - name: Run full TypeScript test suite
        run: |
          pnpm run build
          pnpm exec node --test implementations/typescript/dist/test/*.test.js

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Check release and deployment policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_release.py
          if rg -n '^\s*pull_request_target\s*:' .github/workflows; then
            echo "pull_request_target is not permitted for repository workflows" >&2
            exit 1
          fi
          if rg -n '^\s*contents:\s*write\s*$' .github/workflows/ci.yml; then
            echo "CI must never request write permissions" >&2
            exit 1
          fi

  dependency-review:
    name: dependency-review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

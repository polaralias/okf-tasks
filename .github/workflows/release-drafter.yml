name: Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

# Release Drafter writes a GitHub release draft. It is intentionally limited to
# trusted pushes to main and manual runs on main; pull requests are read by CI
# and must never execute with this workflow's write token.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter-main
  cancel-in-progress: false

jobs:
  update-release-draft:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate repository version
        id: repo-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(<VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a stable X.Y.Z semver" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Update release draft
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ steps.repo-version.outputs.version }}
          name: v${{ steps.repo-version.outputs.version }}
          tag: v${{ steps.repo-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
